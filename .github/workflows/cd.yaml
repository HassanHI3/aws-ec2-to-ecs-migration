name: CD Workflow

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Debug GitHub OIDC claims
        shell: bash
        run: |
          TOKEN_RESPONSE=$(curl -sSf \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")

          TOKEN=$(echo "$TOKEN_RESPONSE" | jq -r '.value')

          PAYLOAD=$(echo "$TOKEN" | cut -d '.' -f2)
          PAYLOAD=$(echo "$PAYLOAD" | tr '_-' '/+')

          case $((${#PAYLOAD} % 4)) in
            2) PAYLOAD="${PAYLOAD}==" ;;
            3) PAYLOAD="${PAYLOAD}=" ;;
          esac

          echo "$PAYLOAD" | base64 -d | jq '{
            sub,
            aud,
            repository,
            ref,
            environment,
            job_workflow_ref
          }'

      - name: OpenID Connect
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::891377356090:role/cicd-assume-role-ec2-ecs
          aws-region: eu-west-2

      - name: Test AWS Authentication
        run: |
          aws sts get-caller-identity

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3 # Set up Docker Buildx so docker/build-push-action@v2 can be used.

      - name: Build and push Docker image
        uses: docker/build-push-action@v2
        with:
          context: ./ec2-legacy-app/app
          platforms: linux/arm64
          push: true # using the sha tag so ecs can deploy a specific immutable version that we can track which commit is running.
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/ec2-legacy-app:latest
            ${{ steps.login-ecr.outputs.registry }}/ec2-legacy-app:${{ github.sha }}

      - name: Terraform Setup
        uses: hashicorp/setup-terraform@v2

      - name: Terraform Init
        working-directory: ec2-legacy-app/terraform-ecs
        run: terraform init

      - name: Terraform format
        working-directory: ec2-legacy-app/terraform-ecs
        run: terraform fmt -check # formatting without making changes in code

      - name: Terraform Plan
        working-directory: ec2-legacy-app/terraform-ecs
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        working-directory: ec2-legacy-app/terraform-ecs
        run: terraform apply -auto-approve tfplan # auto approve so that worklfow can run w/out manual intervention.
        # In production, i will remove this and approve manually.

      - name: Trigger ECS Service Deployment
        run: |
          aws --version
          aws ecs update-service \
            --cluster ec2-to-ecs-migration-production-cluster \
            --service ec2-to-ecs-migration-production-service \
            --force-new-deployment \
            --region eu-west-2
