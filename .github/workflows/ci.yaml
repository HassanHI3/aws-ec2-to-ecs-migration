name: CI Workflow

on:
  workflow_dispatch:

  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read
  security-events: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gives gitleaks access to git history as it was too shallow scan b4

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        with:
          exit-code: '0'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: ec2-legacy-app/app
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Audit Python dependencies
        working-directory: ec2-legacy-app/app
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

      - name: start the application
        working-directory: ec2-legacy-app/app
        run: |
          gunicorn --bind 0.0.0.0:5000 wsgi:app & sleep 5

      - name: Test health endpoint
        working-directory: ec2-legacy-app/app
        run: |
          curl --fail http://localhost:5000/health

      - name: Build Docker image # using commit sha here to make the image distinct
        working-directory: ec2-legacy-app/app
        run: |
          docker build -t ec2-legacy-app:${{ github.sha }} .

      # - name: Use image output
      #   working-directory: ec2-legacy-app/app
      #   run: |
      #       echo "The built image is ecs-legacy-app:latest"

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: 'ec2-legacy-app:${{ github.sha }}'
          format: 'sarif'
          exit-code: '0' # set to 1 to stop the workflow due to vulnerablities
          severity: 'CRITICAL,HIGH' # might fail here and can change it to medium if you want to see all vulnerabilities
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: ec2-legacy-app/terraform-ecs
        run: terraform init -backend=false # initialize terraform without backend configuration to avoid errors in CI/CD

      - name: Terraform fmt
        working-directory: ec2-legacy-app/terraform-ecs
        run: terraform fmt -check # formatting without making changes in code

      - name: Terraform validate
        working-directory: ec2-legacy-app/terraform-ecs
        run: terraform validate

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4

      - name: TFLint Init
        working-directory: ec2-legacy-app/terraform-ecs
        run: tflint --init

      - name: Run TFLint
        working-directory: ec2-legacy-app/terraform-ecs
        run: tflint

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: ec2-legacy-app/terraform-ecs
          framework: terraform