name: Build EC2 Legacy App

on: workflow_dispatch

permissions:
  id-token: write
  contents: read
  security-events: write

jobs:
  build:
    runs-on: ubuntu-latest
    environment: Production
    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Debug GitHub OIDC claims
        shell: bash
        run: |
          TOKEN_RESPONSE=$(curl -sSf \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")

          TOKEN=$(echo "$TOKEN_RESPONSE" | jq -r '.value')

          PAYLOAD=$(echo "$TOKEN" | cut -d '.' -f2)
          PAYLOAD=$(echo "$PAYLOAD" | tr '_-' '/+')

          case $((${#PAYLOAD} % 4)) in
            2) PAYLOAD="${PAYLOAD}==" ;;
            3) PAYLOAD="${PAYLOAD}=" ;;
          esac

          echo "$PAYLOAD" | base64 -d | jq '{
            sub,
            aud,
            repository,
            ref,
            environment,
            job_workflow_ref
          }'

      - name: OpenID Connect
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::891377356090:role/cicd-assume-role-ec2-ecs
          aws-region: eu-west-2

      - name: Terraform Setup
        uses: hashicorp/setup-terraform@v2

      - name: Terraform Init
        working-directory: ec2-legacy-app/terraform
        run: terraform init

      - name: Terraform format
        working-directory: ec2-legacy-app/terraform
        run: terraform fmt -check # formatting without making changes in code

      - name: Terraform Plan
        working-directory: ec2-legacy-app/terraform
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        working-directory: ec2-legacy-app/terraform
        run: terraform apply -auto-approve tfplan # auto approve so that workflow can run w/out manual intervention.
        # In production, i will remove this and approve manually.