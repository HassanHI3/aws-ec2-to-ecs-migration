name: Build EC2 Legacy App

on: workflow_dispatch

permissions:
  id-token: write
  contents: read
  # security-events: write

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: OpenID Connect
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-west-2

      - name: Terraform Setup
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: ec2-legacy-app/terraform
        run: terraform init

      - name: Terraform format
        working-directory: ec2-legacy-app/terraform
        run: terraform fmt -check # formatting without making changes in code

      - name: Terraform Validate
        working-directory: ec2-legacy-app/terraform
        run: terraform validate

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4

      - name: TFLint Init
        working-directory: ec2-legacy-app/terraform
        run: tflint --init

      - name: Run TFLint
        working-directory: ec2-legacy-app/terraform
        run: tflint

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: ec2-legacy-app/terraform
          framework: terraform

      - name: Terraform Plan
        working-directory: ec2-legacy-app/terraform
        run: terraform plan -out=tfplan

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: ec2-legacy-app/terraform/tfplan


  apply:
    needs: plan
    runs-on: ubuntu-latest
    environment: Production

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: ec2-legacy-app/terraform

      - name: OpenID Connect
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-west-2

      - name: Terraform Setup
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: ec2-legacy-app/terraform
        run: terraform init

      - name: Terraform Apply
        working-directory: ec2-legacy-app/terraform
        run: terraform apply -auto-approve tfplan # auto approve so that workflow can run w/out manual intervention.
        # In production, i will remove this and approve manually.
        # Production approval is handled by the GitHub Environment protection rules.